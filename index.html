<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levin &amp; Solms Reading Desk</title>
<meta name="description" content="Podcasts, articles and papers with Michael Levin and Mark Solms, newest first.">
<meta property="og:type" content="website">
<meta property="og:title" content="Levin &amp; Solms Reading Desk">
<meta property="og:description" content="Podcasts, articles and papers with Michael Levin and Mark Solms, newest first.">
<meta property="og:url" content="https://omatty123.github.io/levin-solms-desk/">
<meta property="og:image" content="https://omatty123.github.io/levin-solms-desk/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://omatty123.github.io/levin-solms-desk/og.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161616'/%3E%3Crect x='6' y='8' width='4' height='16' rx='2' fill='%232f7d78'/%3E%3Crect x='12' y='12' width='4' height='12' rx='2' fill='%232f7d78'/%3E%3Crect x='18' y='6' width='4' height='18' rx='2' fill='%23c0392b'/%3E%3Crect x='24' y='14' width='3' height='10' rx='1.5' fill='%23c0392b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfaf8; --surface:#ffffff; --ink:#161616; --ink-2:#4a4a4a; --ink-3:#7a7a7a;
  --rule:#e4e1dc; --rule-strong:#161616;
  --levin:#2f7d78; --levin-bg:#e6f1f0; --solms:#b0372b; --solms-bg:#f7e7e4;
  --chip:#efece7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1b1b1b; --ink:#ededed; --ink-2:#b9b9b9; --ink-3:#8a8a8a;
    --rule:#2c2c2c; --rule-strong:#ededed;
    --levin:#6cc3bc; --levin-bg:#183331; --solms:#ec8a7d; --solms-bg:#3a201c; --chip:#262626;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1b1b1b; --ink:#ededed; --ink-2:#b9b9b9; --ink-3:#8a8a8a;
  --rule:#2c2c2c; --rule-strong:#ededed;
  --levin:#6cc3bc; --levin-bg:#183331; --solms:#ec8a7d; --solms-bg:#3a201c; --chip:#262626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:min(1032px,calc(100% - 48px));margin-left:auto;margin-right:auto}

/* header */
header{border-bottom:2px solid var(--rule-strong);padding-top:22px;padding-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:750}
h1 .l{color:var(--levin)} h1 .s{color:var(--solms)} h1 .amp{color:var(--ink-3);font-weight:400}
.meta{font-size:13px;color:var(--ink-3);text-align:right}
.meta b{color:var(--ink-2);font-weight:600}

/* people strip */
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 0}
.person{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid;
  font:inherit;color:inherit;text-align:left;cursor:pointer;transition:opacity .15s,background .15s}
.person:hover{border-color:var(--ink-3)}
.person.levin[aria-pressed="true"]{background:var(--levin-bg)} .person.solms[aria-pressed="true"]{background:var(--solms-bg)}
.people.picked .person[aria-pressed="false"]{opacity:.5}
.person.levin{border-left-color:var(--levin)} .person.solms{border-left-color:var(--solms)}
.person strong{font-size:15px}
.person span{font-size:13px;color:var(--ink-3)}
.person em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-3)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-top:14px;padding-bottom:14px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
.group{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);
  padding:5px 11px;border-radius:999px;cursor:pointer}
.filters button .n{color:var(--ink-3);margin-left:4px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* list */
.week{margin-top:22px}
.week h2{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.item{display:grid;grid-template-columns:64px 74px 1fr 128px;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:start}
.date{font-size:13px;color:var(--ink-2);padding-top:2px}
.date b{display:block;font-size:20px;line-height:1;color:var(--ink);font-weight:650}
.who{font-size:12px;font-weight:650;padding:3px 8px;border-radius:4px;justify-self:start;margin-top:2px}
.who.levin{color:var(--levin);background:var(--levin-bg)} .who.solms{color:var(--solms);background:var(--solms-bg)}
.title{font-size:17px;font-weight:650;line-height:1.3;text-decoration:none;letter-spacing:-.005em}
.title:hover{text-decoration:underline;text-underline-offset:3px}
.title::after{content:" ↗";font-weight:400;color:var(--ink-3);font-size:14px}
.src{font-size:13px;color:var(--ink-3);margin-top:2px}
.blurb{font-size:14px;color:var(--ink-2);margin:5px 0 0;max-width:62ch}
.flag{display:inline-block;font-size:12px;color:var(--ink-2);border:1px dashed var(--ink-3);border-radius:4px;padding:1px 7px;margin-top:6px}
.kind{text-align:right;font-size:13px;color:var(--ink-2);padding-top:2px}
.kind .len{display:block;color:var(--ink-3)}
.empty{padding:30px 0;color:var(--ink-3)}
footer{padding:28px 0 40px;font-size:13px;color:var(--ink-3)}

@media (max-width:720px){
  .wrap{width:calc(100% - 32px)}
  h1{font-size:28px}
  .meta{text-align:left}
  .people{grid-template-columns:1fr}
  .item{grid-template-columns:52px 1fr;gap:4px 12px}
  .who{grid-column:2;grid-row:1}
  .date{grid-row:1 / span 3}
  .main{grid-column:2}
  .kind{grid-column:2;text-align:left}
  .kind .len{display:inline;margin-left:6px}

}
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <h1><span class="l">Levin</span> <span class="amp">&amp;</span> <span class="s">Solms</span></h1>
    <div class="meta"><b data-count="all"></b> since <span id="since"></span> · last checked <span id="checked"></span></div>
  </div>
  <div class="people">
    <button class="person levin" data-v="levin" aria-pressed="false"><strong>Michael Levin</strong><span></span><em></em></button>
    <button class="person solms" data-v="solms" aria-pressed="false"><strong>Mark Solms</strong><span></span><em></em></button>
  </div>
</header>

<nav class="wrap filters" aria-label="Filter">
  <div class="group" data-key="type"></div>
</nav>

<main class="wrap" id="list"></main>

<script>
let ITEMS = [];
const NAMES={levin:"Levin",solms:"Solms"};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sept","Oct","Nov","Dec"];
const state={who:"all",type:"all"};
// read ?type=podcast like the original
function applyParam(){try{const p=new URLSearchParams(location.search).get("type");
  if(p){const t=[...new Set(ITEMS.map(i=>i.type))].find(t=>t.toLowerCase().startsWith(p.toLowerCase()));if(t)state.type=t}}catch(e){}}

const d=s=>new Date(s+"T12:00:00Z");
const monday=s=>{const x=d(s);x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x};
const fmt=x=>`${x.getUTCDate()} ${MON[x.getUTCMonth()]}`;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buttons(){
  const opts={
    who:[["all","Both"],["levin","Levin"],["solms","Solms"]],
    type:[["all","All types"],...["Podcast","Article","Peer-reviewed paper","Preprint"].map(t=>[t,t==="Podcast"?"Podcasts":t==="Article"?"Articles":t==="Peer-reviewed paper"?"Papers":"Preprints"])]
  };
  for(const key of ["type"]){
    const g=document.querySelector(`.group[data-key=${key}]`);
    g.innerHTML=opts[key].map(([v,label])=>{
      const n=ITEMS.filter(i=>(v==="all"||i[key]===v)&&(key==="who"?(state.type==="all"||i.type===state.type):(state.who==="all"||i.who===state.who))).length;
      return `<button data-v="${esc(v)}" aria-pressed="${state[key]===v}">${label}<span class="n">${n}</span></button>`}).join("");
    g.onclick=e=>{const b=e.target.closest("button");if(!b)return;state[key]=b.dataset.v;render()};
  }
  const people=document.querySelector(".people");
  people.classList.toggle("picked",state.who!=="all");
  people.querySelectorAll(".person").forEach(c=>{
    const on=state.who===c.dataset.v;
    c.setAttribute("aria-pressed",on);
    c.querySelector("span").textContent=ITEMS.filter(i=>i.who===c.dataset.v&&(state.type==="all"||i.type===state.type)).length+" items";
    c.querySelector("em").textContent=on?"Show both":"";
  });
}
function render(){
  buttons();
  const list=ITEMS.filter(i=>(state.who==="all"||i.who===state.who)&&(state.type==="all"||i.type===state.type))
    .sort((a,b)=>b.date.localeCompare(a.date)||a.who.localeCompare(b.who));
  const weeks=new Map();
  for(const i of list){const k=monday(i.date).toISOString().slice(0,10);(weeks.get(k)||weeks.set(k,[]).get(k)).push(i)}
  document.getElementById("list").innerHTML=list.length?[...weeks].map(([k,items])=>`
    <section class="week"><h2>Week of ${fmt(d(k))}</h2>${items.map(i=>{const x=d(i.date);return `
      <article class="item">
        <div class="date"><b>${x.getUTCDate()}</b>${MON[x.getUTCMonth()]}</div>
        <span class="who ${i.who}">${NAMES[i.who]}</span>
        <div class="main">
          <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
          <div class="src">${esc(i.src)}</div>
          <p class="blurb">${esc(i.blurb)}</p>
          ${i.flag?`<span class="flag">${esc(i.flag)}</span>`:""}
        </div>
        <div class="kind">${esc(i.type)}${i.len?`<span class="len">${esc(i.len)}</span>`:""}</div>
      </article>`}).join("")}</section>`).join(""):`<p class="empty">Nothing matches these filters.</p>`;
}
document.querySelector(".people").onclick=e=>{const c=e.target.closest(".person");if(!c)return;state.who=state.who===c.dataset.v?"all":c.dataset.v;render()};
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
  ITEMS=data.items;
  const s=d(data.since), c=new Date(data.last_checked);
  document.getElementById("since").textContent=s.toLocaleString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
  document.getElementById("checked").textContent=`${c.getUTCDate()} ${MON[c.getUTCMonth()]} ${c.getUTCFullYear()}, ${String(c.getUTCHours()).padStart(2,"0")}:${String(c.getUTCMinutes()).padStart(2,"0")} UTC`;
  document.querySelector("b[data-count]").textContent=ITEMS.length+" items";
  applyParam(); render();
}).catch(()=>{document.getElementById("list").innerHTML='<p class="empty">Couldn’t load the list. Try reloading.</p>'});
</script>
</body>
</html>
